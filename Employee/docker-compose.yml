version: '3.8'

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: nexushr-postgres

    environment:
      POSTGRES_DB: nexushr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      # Host-side port only - mapped to 5434 instead of 5432 because this
      # machine also has a native Windows PostgreSQL install already bound
      # to 5432 (holding this project's pre-pgvector local dev data; see
      # db_backups/ for the pg_dump taken before this switch), and a
      # different, unrelated project's Postgres container already using
      # 5433. The 'app' service below is unaffected - it talks to this
      # container over Docker's internal network on the container's own
      # port 5432 regardless of what the host-side mapping is.
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: nexushr-redis

    ports:
      # Host-side port only, same reasoning as postgres above - an unrelated
      # project's Redis container already occupies 6379 on this machine.
      - "6380:6379"

  app:
    build: .

    container_name: nexushr-app

    depends_on:
      - postgres
      - redis

    ports:
      - "8081:8081"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexushr
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}

volumes:
  postgres_data: