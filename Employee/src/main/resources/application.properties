
spring.application.name=Employee
server.port=8081

# Render sits behind Cloudflare's proxy - without this, request.getRemoteAddr()
# (used by RateLimitFilter) sees the proxy's IP instead of the real client's,
# so every request lands in a different rate-limit bucket. This makes Spring
# Boot auto-register ForwardedHeaderFilter at the front of the chain, which
# rewrites getRemoteAddr()/getScheme()/etc. from X-Forwarded-* headers using
# the first (original client) IP in the chain. Harmless for local/direct
# testing - falls back to the real connection info when no such header exists.
server.forward-headers-strategy=framework

# Port 5434, not 5432 - this machine's local Postgres for this project is
# now the pgvector/pgvector:pg17 container (docker-compose.yml), needed for
# the Day 6+ AI work. It's mapped off the default port because a native
# Windows Postgres install already holds this project's pre-pgvector data on
# 5432 (see Employee/../db_backups/ for the pg_dump taken before the switch),
# and an unrelated project's container already used 5433. Doesn't affect
# Render (SPRING_DATASOURCE_URL env var overrides this) or the test suite
# (Testcontainers overrides it too, in AbstractIntegrationTest).
spring.datasource.url=jdbc:postgresql://localhost:5434/nexushr
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway owns schema creation; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# CORS — comma-separated origins allowed to call this API (the deployed
# frontend origin gets added via env var once it exists; localhost:5173 is
# the local Vite dev server default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT - 15 min access, 7 day refresh
app.security.jwt.secret-key=${JWT_SECRET_KEY}
app.security.jwt.expiration-ms=900000
app.security.jwt.refresh-expiration-ms=604800000

# Redis
spring.cache.type=redis
spring.data.redis.host=localhost
# 6380, not 6379 - an unrelated project's Redis container already occupies
# 6379 on this machine. Doesn't affect Render or the test suite, same as
# the datasource port above.
spring.data.redis.port=6380
spring.data.redis.repositories.enabled=false

# Jackson — ISO-8601 dates in all JSON responses and Redis Pub/Sub payloads
spring.jackson.serialization.write-dates-as-timestamps=false

# Mail

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

##########################################
# Spring Batch
##########################################

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# AI service - attrition prediction (Day 7). Same fail-safe-with-clear-config
# philosophy as JWT_SECRET_KEY above, but not a secret, so a sane localhost
# default is fine here where JWT_SECRET_KEY has none.
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}

##########################################
# RAG chatbot (Day 9) - Gemini free tier
##########################################

# Gemini Developer API (Google AI Studio), not Vertex AI - a free-tier API
# key, same fail-fast-with-no-default treatment as JWT_SECRET_KEY. Chat and
# embedding connections are bound to separate property prefixes (the
# embedding side doesn't inherit the chat side's api-key), so both need it
# set explicitly or the embedding autoconfig falls back to Vertex AI mode
# and fails demanding a GCP project-id.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
# gemini-2.5-flash was retired for new API keys (the live API 404s and
# points at this replacement) - verified against the real Gemini API, not
# docs, since docs still list 2.5-flash as current.
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

# gemini-embedding-001 is the connection's default model and the one Google
# recommends for API-key (Developer API) mode - text-embedding-004, the
# older model, was deprecated 2026-01-14 and 404s against the Developer API
# now. It natively outputs 3072 dimensions but supports truncation via
# `dimensions`; pinned to 768 here to match the embedding column in
# V30__create_hr_policy_vector_store.sql (768 was picked to keep the column
# small - any of the model's supported truncation sizes would work equally).
# Flyway (not Spring AI) owns the vector_store table, so schema-validation
# is on and initialize-schema stays off - same division of ownership as
# Hibernate's ddl-auto=validate above.
spring.ai.google.genai.embedding.text.options.dimensions=768
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.schema-validation=true
spring.ai.vectorstore.pgvector.initialize-schema=false



