# SPA fallback - same behavior as vercel.json's rewrite rule. Without this,
# a hard refresh on any client-side route (e.g. /performance) 404s, since
# nginx would otherwise look for a literal /performance file that doesn't
# exist on disk.
#
# /api/ is reverse-proxied to the backend container by Docker network name.
# This matters beyond convenience: VITE_API_BASE_URL is baked into the JS
# bundle at build time and runs in the *browser*, which can never resolve a
# Docker-internal (or later, Kubernetes-internal) hostname like
# "backend:8081" - only other containers on the same network can. Proxying
# here means the browser only ever talks to this container's own origin
# (a relative /api/... path), and nginx does the container-to-container
# hop server-side - the same shape an Ingress will need to handle in EKS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
