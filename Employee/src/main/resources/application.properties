
spring.application.name=Employee
server.port=8081

# Render sits behind Cloudflare's proxy - without this, request.getRemoteAddr()
# (used by RateLimitFilter) sees the proxy's IP instead of the real client's,
# so every request lands in a different rate-limit bucket. This makes Spring
# Boot auto-register ForwardedHeaderFilter at the front of the chain, which
# rewrites getRemoteAddr()/getScheme()/etc. from X-Forwarded-* headers using
# the first (original client) IP in the chain. Harmless for local/direct
# testing - falls back to the real connection info when no such header exists.
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://localhost:5432/nexushr
spring.datasource.username=postgres
spring.datasource.password=postgres

# Flyway owns schema creation; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# CORS — comma-separated origins allowed to call this API (the deployed
# frontend origin gets added via env var once it exists; localhost:5173 is
# the local Vite dev server default)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT - 15 min access, 7 day refresh
app.security.jwt.secret-key=${JWT_SECRET_KEY}
app.security.jwt.expiration-ms=900000
app.security.jwt.refresh-expiration-ms=604800000

# Redis
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# Jackson — ISO-8601 dates in all JSON responses and Redis Pub/Sub payloads
spring.jackson.serialization.write-dates-as-timestamps=false

# Mail

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

##########################################
# Spring Batch
##########################################

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false



